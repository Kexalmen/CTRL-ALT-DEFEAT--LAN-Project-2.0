!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CHAG-R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 ip address 4.28.75.22 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 ip address 192.168.68.9 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 ip address 192.168.68.13 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet3/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router eigrp 38
 redistribute static metric 10000 100 255 1 1500 route-map STATIC-TO-EIGRP
 network 4.28.75.0 0.0.0.255
 no auto-summary
!
ip forward-protocol nd
ip route 8.28.30.0 255.255.255.192 192.168.68.10
ip route 8.28.30.0 255.255.255.192 192.168.68.14 10
ip route 8.48.53.0 255.255.255.0 192.168.68.10
ip route 8.48.53.0 255.255.255.0 192.168.68.14 10
ip route 10.1.0.0 255.255.252.0 192.168.68.10
ip route 10.1.0.0 255.255.252.0 192.168.68.14 10
!
!
no ip http server
no ip http secure-server
!
!
ip prefix-list EXTERNAL-ROUTES seq 5 permit 8.28.30.0/26
ip prefix-list EXTERNAL-ROUTES seq 10 permit 8.48.53.0/24
ip prefix-list EXTERNAL-ROUTES seq 15 permit 10.1.0.0/22
no cdp log mismatch duplex
!
route-map STATIC-TO-EIGRP permit 10
 match ip address prefix-list EXTERNAL-ROUTES
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
