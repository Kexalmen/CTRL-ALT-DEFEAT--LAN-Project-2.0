!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname S13-R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet0/0.311
 encapsulation dot1Q 311
 ip address 8.48.53.85 255.255.255.252
!
interface FastEthernet0/0.321
 encapsulation dot1Q 321
 ip address 8.48.53.89 255.255.255.252
!
interface FastEthernet0/0.331
 encapsulation dot1Q 331
 ip address 8.48.53.93 255.255.255.252
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 ip address 10.1.1.14 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 ip address 10.1.1.42 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/0
 ip address 10.1.1.45 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet3/0
 ip address 10.1.3.1 255.255.255.248
 duplex auto
 speed auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router eigrp 41
 redistribute rip metric 10000 100 255 1 1500 route-map RIP-TO-EIGRP
 passive-interface default
 no passive-interface FastEthernet0/1
 no passive-interface FastEthernet1/0
 no passive-interface FastEthernet2/0
 network 8.48.53.84 0.0.0.3
 network 8.48.53.88 0.0.0.3
 network 8.48.53.92 0.0.0.3
 network 10.1.1.12 0.0.0.3
 network 10.1.1.40 0.0.0.3
 network 10.1.1.44 0.0.0.3
 no auto-summary
!
router rip
 version 2
 redistribute eigrp 41 metric 2 route-map EIGRP-TO-RIP
 passive-interface default
 no passive-interface FastEthernet3/0
 network 8.0.0.0
 network 10.0.0.0
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
!
route-map EIGRP-TO-RIP deny 10
 match tag 30
!
route-map EIGRP-TO-RIP permit 20
 match tag 50
!
route-map EIGRP-TO-RIP permit 30
 set tag 41
!
route-map RIP-TO-EIGRP deny 10
 match tag 41
!
route-map RIP-TO-EIGRP permit 20
 match tag 50
!
route-map RIP-TO-EIGRP permit 30
 set tag 30
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
