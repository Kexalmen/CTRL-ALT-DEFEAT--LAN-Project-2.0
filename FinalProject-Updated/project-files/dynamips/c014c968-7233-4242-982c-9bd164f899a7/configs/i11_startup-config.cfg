!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname S23-R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet0/0.311
 encapsulation dot1Q 311
 ip address 8.48.53.121 255.255.255.252
!
interface FastEthernet0/0.321
 encapsulation dot1Q 321
 ip address 8.48.53.125 255.255.255.252
!
interface FastEthernet0/0.331
 encapsulation dot1Q 331
 ip address 8.48.53.129 255.255.255.252
!
interface Serial0/0
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet0/1
 ip address 10.1.2.6 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/1
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 ip address 10.1.2.9 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/0
 ip address 10.1.2.13 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet3/0
 ip address 10.1.3.4 255.255.255.248
 duplex auto
 speed auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router ospf 5
 log-adjacency-changes
 redistribute rip subnets route-map RIP-TO-OSPF
 passive-interface default
 no passive-interface FastEthernet0/1
 no passive-interface FastEthernet1/0
 no passive-interface FastEthernet2/0
 network 8.48.53.120 0.0.0.3 area 0
 network 8.48.53.124 0.0.0.3 area 0
 network 8.48.53.128 0.0.0.3 area 0
 network 10.1.2.4 0.0.0.3 area 0
 network 10.1.2.8 0.0.0.3 area 0
 network 10.1.2.12 0.0.0.3 area 0
!
router rip
 version 2
 redistribute ospf 5 metric 2 route-map OSPF-TO-RIP
 passive-interface default
 no passive-interface FastEthernet3/0
 network 8.0.0.0
 network 10.0.0.0
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
ip prefix-list BLOCK-DEFAULT seq 5 permit 0.0.0.0/0
no cdp log mismatch duplex
!
route-map OSPF-TO-RIP deny 5
 match ip address prefix-list BLOCK-DEFAULT
!
route-map OSPF-TO-RIP deny 10
 match tag 30
!
route-map OSPF-TO-RIP permit 20
 match tag 41
!
route-map OSPF-TO-RIP permit 30
 set tag 50
!
route-map RIP-TO-OSPF deny 10
 match tag 50
!
route-map RIP-TO-OSPF permit 20
 match tag 41
!
route-map RIP-TO-OSPF permit 30
 set tag 30
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
